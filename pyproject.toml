[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drose"
version = "1.0.0"
description = "Download YouTube Music playlists as MP3"
requires-python = ">=3.12"
dependencies = [
    "typer[all]>=0.21.1,<1.0",
    "rich>=14.2.0,<15.0",
    "yt-dlp>=2025.12.8,<2026.0",
    "imageio-ffmpeg>=0.6.0,<0.7.0",
    "pyfiglet>=1.0.4,<2.0",
    "ascii-magic>=2.7.4,<3.0",
]

[project.scripts]
drose = "cli.app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*"]
exclude = ["web*", "downloads*", "rawDownloads*", "logos*", "assets*", "zip_test*", "venv*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]
web=[
    "fastapi>=0.111.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.23.0",
    "jinja2>=3.1.3",
    "PyExecJS",
    "python-multipart",
]